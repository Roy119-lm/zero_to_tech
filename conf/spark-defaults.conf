spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                  jdbc
spark.sql.catalog.iceberg.jdbc.user             iceberg_user
spark.sql.catalog.iceberg.jdbc.password         iceberg_password
spark.sql.catalog.iceberg.jdbc.driver           org.postgresql.Driver
spark.sql.catalog.iceberg.jdbc.schema-version   V1
spark.sql.catalog.iceberg.uri                   jdbc:postgresql://postgres:5432/iceberg_catalog
spark.sql.catalog.iceberg.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.warehouse             s3://iceberg-warehouse/warehouse/

spark.sql.catalog.iceberg.s3.endpoint           http://minio:9000
spark.sql.catalog.iceberg.s3.access-key-id      minioadmin
spark.sql.catalog.iceberg.s3.secret-access-key  minioadmin
spark.sql.catalog.iceberg.s3.path-style-access  true
spark.sql.defaultCatalog                        iceberg
# spark.eventLog.enabled                          true
# spark.eventLog.dir                              /home/iceberg/spark-events
# spark.history.fs.logDirectory                   /home/iceberg/spark-events
spark.sql.catalogImplementation                 in-memory
spark.sql.hive.history.file                     /tmp/spark-sql-history/.hivehistory
spark.hadoop.native.lib.available               false
